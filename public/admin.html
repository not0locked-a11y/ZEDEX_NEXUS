<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><title>Newsroom Control Room | ZEDEX NEXUS</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><link rel="apple-touch-icon" href="/favicon.svg?v=1"><link rel="stylesheet" href="/style.css"></head>
<body class="staff-page"><header class="staff-header"><a class="brand brand-image" href="/" aria-label="ZEDEX NEXUS home"><img class="brand-logo" src="/logo.svg?v=3" alt="ZEDEX NEXUS"></a><div><span id="staffIdentity" class="muted"></span> <button id="logout" class="outline">Sign out</button></div></header>
<main class="staff-wrap"><div class="eyebrow">ZEDEX CONTROL ROOM</div><h1>Newsroom dashboard</h1><nav class="staff-nav dashboard-tabs" aria-label="Newsroom sections"><button type="button" class="dashboard-tab active" data-panel="editorSection">Article editor</button><button type="button" class="dashboard-tab" data-panel="aiSection">AI generation</button><button type="button" class="dashboard-tab" data-panel="manageSection">Manage articles</button></nav>
<section id="editorSection" class="staff-section dashboard-panel"><div class="eyebrow">01 / CONTENT CREATION</div><h2>Article editor</h2><form id="articleForm"><input id="title" placeholder="Article headline" required><div class="staff-grid"><input id="category" placeholder="Category (e.g. Technology)"><input id="excerpt" placeholder="Short summary"></div><input id="source" placeholder="Source URL (optional)"><label class="muted" for="imageFile">Upload article photo (stored in Google Drive)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="imageUrl" placeholder="Drive image URL" readonly><div class="toolbar"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="italic"><i>I</i></button><button type="button" data-cmd="underline"><u>U</u></button><select id="fontFamily" title="Font family"><option value="">Font family</option><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>Courier New</option><option>Garamond</option><option>Roboto</option><option>Inter</option></select><select id="fontSize" title="Font size"><option value="">Font size</option><option>10px</option><option>12px</option><option>14px</option><option selected>16px</option><option>18px</option><option>20px</option><option>24px</option><option>28px</option><option>32px</option><option>36px</option><option>48px</option><option>64px</option></select><select id="lineSpacing" title="Line spacing"><option value="1">Line 1.0</option><option value="1.15">Line 1.15</option><option value="1.5" selected>Line 1.5</option><option value="1.75">Line 1.75</option><option value="2">Line 2.0</option></select><input id="fontColor" type="color" value="#111111" title="Font colour"><button type="button" data-cmd="justifyLeft">Left</button><button type="button" data-cmd="justifyCenter">Centre</button><button type="button" data-cmd="justifyRight">Right</button></div><div id="editor" contenteditable="true" class="editor" data-placeholder="Write your story here…"></div><div class="actions"><button type="button" id="saveDraft" class="outline">Save draft</button><button type="submit" class="cta">Publish article</button><button type="button" id="clearEditor" class="outline">Clear editor</button></div></form><p id="editorStatus" class="status" role="status"></p></section>
<section id="aiSection" class="staff-section dashboard-panel hidden"><div class="eyebrow">02 / AUTOMATED NEWSROOM</div><h2>AI article generation</h2><p class="muted">Generate multiple articles in one request. Each article is saved and published separately.</p><div class="actions"><label for="aiCount">Number of articles (1–10)</label><input id="aiCount" type="number" min="1" max="10" value="1" style="max-width:110px"><button id="aiGenerate" class="cta" type="button">✦ Generate &amp; publish</button></div><p id="aiStatus" class="status" role="status"></p></section>
<section id="manageSection" class="staff-section dashboard-panel hidden"><div class="eyebrow">03 / CONTENT LIBRARY</div><h2>Manage articles</h2><div class="actions"><button id="refreshAdmin" class="outline" type="button">Refresh articles</button></div><div id="adminArticles"></div><p id="manageStatus" class="status" role="status"></p></section></main><script src="/admin.js"></script></body></html>
