<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><title>Staff Login | ZEDEX NEXUS</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><link rel="apple-touch-icon" href="/favicon.svg?v=1"><link rel="stylesheet" href="/style.css"></head>
<body class="staff-page"><header class="staff-header"><a class="brand brand-image" href="/" aria-label="ZEDEX NEXUS home"><img class="brand-logo" src="/logo.svg?v=3" alt="ZEDEX NEXUS"></a><a class="outline" href="/">Back to website</a></header>
<main class="staff-wrap"><section class="staff-login"><div class="eyebrow">SECURE NEWSROOM ACCESS</div><h1>Staff login</h1><p class="muted">Sign in to open the ZEDEX NEXUS control room.</p><form id="staffLogin"><input id="staffEmail" type="email" placeholder="Email address" autocomplete="username" required><input id="staffPassword" type="password" placeholder="Password" autocomplete="current-password" required><button class="cta full" type="submit">Sign in to newsroom ↗</button></form><p id="loginStatus" class="status" role="status"></p></section></main>
<script>
const form=document.getElementById("staffLogin"),status=document.getElementById("loginStatus");
form.addEventListener("submit",async e=>{e.preventDefault();const button=form.querySelector("button");button.disabled=true;status.textContent="Signing in…";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("staffEmail").value,password:document.getElementById("staffPassword").value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Login failed");localStorage.setItem("zn_token",data.token);localStorage.setItem("zn_role",data.role||"");localStorage.setItem("zn_email",data.email||"");location.href="/admin.html";}catch(err){status.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>
